<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Exam Performance Predictor</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #6dd5fa, #2980b9);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .header-bar {
      background: #ffffff;
      padding: 12px;
      text-align: center;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    .header-bar h1 {
      color: #0d6efd;
      font-weight: 700;
      margin: 0;
      font-size: 24px;
    }
    .form-section {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
      padding: 20px;
      margin: 30px auto;   /* top & bottom space */
      max-width: 750px;    /* smaller width */
    }
    .form-label {
      font-weight: 500;
      font-size: 14px;
    }
    .form-control-sm {
      font-size: 14px;
      padding: 6px 8px;
    }
    .btn-custom {
      background: #0d6efd;
      border: none;
      padding: 8px;
      font-size: 15px;
      border-radius: 6px;
      transition: 0.3s;
    }
    .btn-custom:hover {
      background: #084298;
    }
    h2 {
      color: #198754;
      font-weight: 600;
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header-bar">
    <h1>📊 Student Exam Performance Predictor</h1>
  </div>

  <!-- Form Section (Smaller & Compact) -->
  <div class="form-section">
    <form action="{{ url_for('predict_datapoint')}}" method="post">
      <div class="row g-3">
        <!-- Left Column -->
        <div class="col-md-6">
          <div class="mb-2">
            <label class="form-label">Gender</label>
            <select class="form-control form-control-sm" name="gender" required>
              <option selected disabled value="">Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label">Race or Ethnicity</label>
            <select class="form-control form-control-sm" name="race_ethnicity" required>
              <option selected disabled value="">Select Ethnicity</option>
              <option value="group A">Group A</option>
              <option value="group B">Group B</option>
              <option value="group C">Group C</option>
              <option value="group D">Group D</option>
              <option value="group E">Group E</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label">Parental Level of Education</label>
            <select class="form-control form-control-sm" name="parental_level_of_education" required>
              <option selected disabled value="">Select Parent Education</option>
              <option value="associate's degree">Associate's Degree</option>
              <option value="bachelor's degree">Bachelor's Degree</option>
              <option value="high school">High School</option>
              <option value="master's degree">Master's Degree</option>
              <option value="some college">Some College</option>
              <option value="some high school">Some High School</option>
            </select>
          </div>
        </div>

        <!-- Right Column -->
        <div class="col-md-6">
          <div class="mb-2">
            <label class="form-label">Lunch Type</label>
            <select class="form-control form-control-sm" name="lunch" required>
              <option selected disabled value="">Select Lunch Type</option>
              <option value="free/reduced">Free/Reduced</option>
              <option value="standard">Standard</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label">Test Preparation Course</label>
            <select class="form-control form-control-sm" name="test_preparation_course" required>
              <option selected disabled value="">Select Test Course</option>
              <option value="none">None</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label">Reading Score (0 - 100)</label>
            <input class="form-control form-control-sm" type="number" name="reading_score" placeholder="Enter Reading Score" min="0" max="100" required>
          </div>

          <div class="mb-2">
            <label class="form-label">Writing Score (0 - 100)</label>
            <input class="form-control form-control-sm" type="number" name="writing_score" placeholder="Enter Writing Score" min="0" max="100" required>
          </div>
        </div>
      </div>

      <!-- Submit -->
      <div class="d-grid mt-3">
        <button class="btn btn-custom" type="submit">Predict Maths Score</button>
      </div>
    </form>

    <!-- Prediction Result -->
    <h2>
  {% if results %}
    🎯 Prediction: {{ results }}
  {% endif %}
</h2>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
